name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - modules/dynamic_environment
          - modules/gitlab_ci_pipelines
          - modules/project
          - modules/renovate
          - modules/renovate_repository
        include:
          # Existing root validations reference other variables/locals (Terraform 1.9+).
          - path: .
            terraform_version: 1.9.8
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform_version || '1.7.0' }}
          terraform_wrapper: false
      # These suites use mock providers and require no cloud credentials/backend.
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - run: terraform test -no-color

  renovate-mr-helper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s modules/renovate_repository/tests -p '*_test.py'
