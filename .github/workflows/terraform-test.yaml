name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    permissions:
      actions: write
      contents: write
      discussions: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - modules/dynamic_environment
          - modules/gitlab_ci_pipelines
          - modules/project
          - modules/renovate
          - modules/renovate_repository
        include:
          # Existing root validations reference other variables/locals (Terraform 1.9+).
          - path: .
            terraform_version: 1.9.8

    steps:
    - uses: dasmeta/reusable-actions-workflows/terraform-test@4.3.0
      with:
        aws-region: ${{ secrets.AWS_REGION}}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        path: ${{ matrix.path }}
        terraform_version: ${{ matrix.terraform_version || '1.7.0' }}

  renovate-mr-helper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s modules/renovate_repository/tests -p '*_test.py'
